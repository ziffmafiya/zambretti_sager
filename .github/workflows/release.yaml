name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"   # matches tags like 1.9.51

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Extract the section for this version from CHANGELOG.md
          # Section starts with "## [X.Y.Z]" and ends before the next "## ["
          NOTES=$(awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          # Trim leading/trailing blank lines
          NOTES=$(echo "$NOTES" | sed '/./,$!d' | sed -e :a -e '/^\s*$/{$d;N;ba}')
          # Write to file to preserve multiline
          echo "$NOTES" > release_notes.md
          echo "Release notes:"
          cat release_notes.md

      - name: Build zip
        run: |
          cd custom_components
          zip -r ../zambretti_sager.zip zambretti_sager/
          echo "Built zambretti_sager.zip"
          ls -lh ../zambretti_sager.zip

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: release_notes.md
          files: zambretti_sager.zip
          fail_on_unmatched_files: true
